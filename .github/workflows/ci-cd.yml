name: Travel Control CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: travel-control-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/*.sh
          if command -v shellcheck >/dev/null 2>&1; then shellcheck scripts/*.sh; fi
          bash scripts/test-backup-permissions.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore backend
        run: dotnet restore TravelControl.slnx
      - name: Build backend
        run: dotnet build TravelControl.slnx --configuration Release --no-restore
      - name: Test backend
        run: dotnet test TravelControl.slnx --configuration Release --no-build
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Test frontend
        working-directory: web
        run: npm test
      - name: Build frontend
        working-directory: web
        run: npm run build

  container-e2e:
    name: Container browser tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build test image
        run: docker build -t travel-control:test .
      - name: Remove stale test container
        run: docker rm -f travel-control 2>/dev/null || true
      - name: Start test container
        run: docker run -d --name travel-control -p 127.0.0.1:8080:8080 -e Security__CookieSecure=false -e RateLimiting__AuthPermitLimit=100 -e RateLimiting__PublicPermitLimit=1000 travel-control:test
      - name: Wait for readiness
        shell: bash
        run: |
          for _attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs travel-control --tail 150
          exit 1
      - name: Install browser dependencies
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser and responsive tests
        working-directory: web
        run: npm run e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove test container
        if: always()
        run: docker rm -f travel-control 2>/dev/null || true

  build-image:
    name: Build and publish immutable image
    runs-on: ubuntu-latest
    needs: container-e2e
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy:
    name: Deploy on existing application server
    runs-on: [self-hosted, printcost]
    needs: build-image
    environment: production
    env:
      TRAVELCONTROL_IMAGE: ${{ needs.build-image.outputs.image }}:${{ github.sha }}
      TRAVELCONTROL_HOST_PORT: ${{ vars.TRAVELCONTROL_HOST_PORT }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      EXPECTED_BASE_DOMAIN: crg-dev.com
      TRAVELCONTROL_ROOT: /opt/travel-control
      TRAVELCONTROL_ENV_FILE: /opt/travel-control/travel-control.env
    steps:
      - uses: actions/checkout@v6
      - name: Login to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull commit image
        shell: bash
        run: docker pull "${TRAVELCONTROL_IMAGE}"
      - name: Production preflight
        shell: bash
        env:
          TRAVELCONTROL_COMPOSE_SOURCE: ${{ github.workspace }}/deploy/docker-compose.yml
        run: bash scripts/preflight-travel-control.sh
      - name: Install persistent deployment assets
        shell: bash
        run: |
          install -m 0644 deploy/docker-compose.yml /opt/travel-control/deploy/docker-compose.yml
          install -m 0750 scripts/preflight-travel-control.sh /opt/travel-control/scripts/preflight-travel-control.sh
          install -m 0750 scripts/backup-travel-control.sh /opt/travel-control/scripts/backup-travel-control.sh
          install -m 0750 scripts/restore-travel-control.sh /opt/travel-control/scripts/restore-travel-control.sh
          install -m 0750 scripts/verify-backup-artifact.sh /opt/travel-control/scripts/verify-backup-artifact.sh
          install -m 0750 scripts/deploy-travel-control.sh /opt/travel-control/scripts/deploy-travel-control.sh
          install -m 0750 scripts/verify-production-state.sh /opt/travel-control/scripts/verify-production-state.sh
          install -m 0750 scripts/smoke-public-read.sh /opt/travel-control/scripts/smoke-public-read.sh
      - name: Verify and snapshot sanitized production counts
        shell: bash
        run: |
          /opt/travel-control/scripts/verify-production-state.sh --require-baseline \
            | tee "${RUNNER_TEMP}/travel-control-state-before.txt"
      - name: Back up current persistent state
        shell: bash
        run: |
          if [[ -s /opt/travel-control/data/travel-control.db ]]; then
            /opt/travel-control/scripts/backup-travel-control.sh
          else
            echo "No existing database; backup is not required for the first deployment."
          fi
      - name: Deploy and verify local, container and HTTPS health
        shell: bash
        run: /opt/travel-control/scripts/deploy-travel-control.sh
      - name: Verify persistent state was preserved
        shell: bash
        run: |
          after_state="$(mktemp)"
          before_preserved="$(mktemp)"
          after_preserved="$(mktemp)"
          trap 'rm -f -- "${after_state}" "${before_preserved}" "${after_preserved}"' EXIT
          /opt/travel-control/scripts/verify-production-state.sh --require-baseline --post-deploy \
            | tee "${after_state}"
          preserved='^(passengers|rooms|users|attachments|attachment_files|top_travel_passengers|bespoke_passengers|top_travel_rooms|bespoke_rooms|flight_bookings|ticketed_passengers|copa_passengers|latam_passengers|passengers_without_ticket|baggage_duplicates|attachment_hash_duplicates)='
          grep -E "${preserved}" "${RUNNER_TEMP}/travel-control-state-before.txt" > "${before_preserved}"
          grep -E "${preserved}" "${after_state}" > "${after_preserved}"
          diff -- "${before_preserved}" "${after_preserved}"
      - name: Sanitized diagnostics
        if: failure()
        shell: bash
        run: |
          docker ps -a --filter name=travel-control
          docker logs travel-control --tail 150 2>&1 \
            | sed -E 's/((password|passport|token|secret|pin|authorization)[^= :]*[= :]+)[^ ,;]+/\1[REDACTED]/Ig' \
            || true
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
