name: travel-control
services:
  app:
    image: ${TRAVEL_CONTROL_IMAGE:-travel-control:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Data Source=/var/lib/travel-control/data/travel-control.db
      Security__CookieSecure: ${COOKIE_SECURE:-false}
      Security__DataProtectionKeys: /var/lib/travel-control/keys
      Storage__Root: /var/lib/travel-control/attachments
      Storage__MaxBytes: ${ATTACHMENT_MAX_BYTES:-10485760}
      BootstrapImport__Enabled: ${BOOTSTRAP_IMPORT_ENABLED:-false}
      BootstrapImport__Required: ${BOOTSTRAP_IMPORT_REQUIRED:-false}
      BootstrapImport__MasterWorkbookPath: /var/lib/travel-control/private/Control_viaje.xlsx
    volumes:
      - travel-control-data:/var/lib/travel-control
      - ./data/private:/var/lib/travel-control/private:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  travel-control-data:
