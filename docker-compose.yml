name: travel-control
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_control}
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [ "no-new-privileges:true" ]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-travel_control};Username=${POSTGRES_USER:-travel};Password=${POSTGRES_PASSWORD}
      Security__AllowedOrigins__0: ${ALLOWED_ORIGIN:-https://localhost}
      Storage__Root: /app/storage
      Storage__MaxBytes: ${ATTACHMENT_MAX_BYTES:-10485760}
    volumes:
      - attachment-data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health/ready" ]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [ "/tmp" ]
    security_opt: [ "no-new-privileges:true" ]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-check-certificate", "--spider", "https://localhost" ]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt: [ "no-new-privileges:true" ]

volumes:
  postgres-data:
  attachment-data:
  caddy-data:
  caddy-config:
